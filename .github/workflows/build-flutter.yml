name: Build SHOPIK Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: |
          cd shopik_flutter
          flutter pub get

      - name: Build APK Release
        run: |
          cd shopik_flutter
          flutter build apk --release

      - name: Build AppBundle (AAB) Release
        run: |
          cd shopik_flutter
          flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shopik-release-apk
          path: shopik_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopik-release-aab
          path: shopik_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
