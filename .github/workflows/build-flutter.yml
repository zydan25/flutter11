name: Build SHOPIK Flutter App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./shopik_flutter
        run: |
          flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: ./shopik_flutter
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Prepare Android Signing and Build Environment
        working-directory: ./shopik_flutter/android
        run: |
          rm -f local.properties
          chmod +x gradlew || true
          if [ ! -f key.properties ] && [ -f key.properties.example ]; then
            cp key.properties.example key.properties
          fi
          if [ ! -f app/shopik-release.jks ]; then
            echo "Generating release keystore via keytool..."
            keytool -genkey -v -keystore app/shopik-release.jks -alias shopikpay -keyalg RSA -keysize 2048 -validity 10000 -storepass shopik_pay_secure_2026 -keypass shopik_pay_secure_2026 -dname "CN=Shopik Pay, OU=Mobile, O=Shopik, C=YE"
          fi

      - name: Build Release APK (Android Package)
        working-directory: ./shopik_flutter
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Build Release App Bundle (Google Play AAB)
        working-directory: ./shopik_flutter
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopik-pay-release-apk
          path: shopik_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopik-pay-release-aab
          path: shopik_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### 🚀 تم بناء تطبيق شبيك باي بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID**: \`com.shopik.pay\`" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: شبيك باي" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: \`shopik-pay-release-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release AAB**: \`shopik-pay-release-aab\`" >> $GITHUB_STEP_SUMMARY
