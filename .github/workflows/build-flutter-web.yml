name: Build and Deploy SHOPIK Flutter Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Web Support
        run: flutter config --enable-web

      - name: Install Dependencies
        working-directory: ./shopik_flutter
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ./shopik_flutter
        run: |
          flutter build web \
            --release \
            --base-href "/flutter11/" \
            --no-tree-shake-icons

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Flutter Web to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./shopik_flutter/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
